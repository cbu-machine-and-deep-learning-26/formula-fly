# RQ1 condition (GH-27): flyvis eye with degree-matched shuffled wiring (self-loops held fixed).
# Identical to the other three files in this directory except `name` and `eye.type`:
# every eye emits 5768 features and is frozen, so each trains the same policy head.
# Launch commands and the reasons for the eval cadence: docs/midterm.md.
name: rq1_shuffled
output_dir: runs
seeds: [0, 1, 2]
total_env_steps: 1000000
device: auto

eye:
  type: shuffled
  frozen: true          # false fine-tunes the eye with the policy; needs a feed-forward eye
  params: {}

brain: none             # none = the policy reads the eye directly (GH-23 adds the whole-brain model)

policy:
  hidden_sizes: [64, 64]
  activation: tanh
  normalize_features: true
  init_log_std: 0.0

env:
  type: practice_track  # practice_track | dummy
  max_steps: 15000      # 5 minutes of simulated time at 50 Hz: room for a slow, clean lap
  params:
    racing_line: false  # off for every RQ1 condition
    track_limit: 0.15

ppo:
  rollout_steps: 2048
  minibatches: 32
  epochs: 10
  learning_rate: 3.0e-4
  anneal_learning_rate: true
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_value_loss: true
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantages: true
  target_kl: null

eval:
  every_updates: 25     # ~51k steps: an early policy that stalls runs the full 15k-step cap
  episodes: 1
  max_steps: null       # null = the env's own cap
  record_video: false

logging:
  wandb:
    enabled: false      # CSV is always written; this only adds a W&B mirror
    project: formula-fly
    entity: null
    mode: online
    tags: []
  checkpoint_every_updates: 0   # 0 = only policy_final.pt
