# GH-29: behaviour-clone the round-6 MuJoCo driver (frozen flyvis eye -> 4096-neuron central
# complex -> MLP head) on Ryan's SF70H laps at Silverstone GP, re-rendered through the AC nose
# camera (docs/assetto-corsa-training.md § Behaviour cloning). The result is an init_from for
# PPO in AC. Every key maps to fly_driver.training.bc.BcConfig; unknown keys are an error.
name: bc_flyvis_cx_ac
output_dir: runs
# Builds the eye, brain and policy, and becomes the run's config.yaml: the AC condition the
# clone fine-tunes with. Same brain and head shapes as the MuJoCo rounds.
base_config: fly_driver/configs/train_flyvis_cx_ac_v6.yaml
# The checkpoint round 7 starts from: v6 seed 4 at update 70, the best of round 6.
# Not in git: copied into weights/ (git-ignored).
init_from: weights/round6_best/policy_update_00070.pt
# HumanLaps .npz files from scripts/bc_build_dataset.py. Not in git: data/ is local.
# The evening sessions train; the afternoon drive comes last and is held out whole, so no
# held-out frame shares a session with a training frame.
datasets:
  - data/human_laps/20261022_ryan_eve1.npz
  - data/human_laps/20261022_ryan_eve2.npz
  - data/human_laps/20261022_ryan_eve3.npz
  - data/human_laps/20261022_ryan.npz
holdout_laps: 2  # the afternoon drive's two laps: its clean lap and its partial one
epochs: 30
batch_size: 256
learning_rate: 1.0e-4  # PPO's warm-start rate (v6)
max_grad_norm: 0.5
train_brain: true
device: auto
seed: 0
