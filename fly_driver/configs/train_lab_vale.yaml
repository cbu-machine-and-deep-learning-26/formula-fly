# GH-103: train_lab.yaml with two changes, and nothing else (tests/training/test_lab.py checks).
#
# 1. env.params.start_focus: half the training drives start on the approach to the corners that
#    stop the fly, split evenly between them. In the runs of 2026-11-03 and 04, 1 of 2,416 arrivals
#    got through T3, 195 of 2,809 through T5 and 9 of 6,210 through T10 (Vale), and a lap needs all
#    three. Each zone is as close as a from-rest start can get and still reach the corner's braking
#    point at speed, past the corner before it (docs/training.md has the table). The other half
#    stay uniform, and only those are scored (fly_driver/training/lab.py), so best.json means what
#    it always did.
# 2. ppo.entropy_coef: 0.002, down from 0.005. 0.001 let entropy fall 2.1 -> 1.2-1.5 in round 6;
#    at 0.005 it is rising (1.93 -> 2.15 over 3.2M steps) and the drives are not getting better.
#
# Run it from its own checkout, so it has its own weights/best/ (AGENTS.md, Lab PCs):
#   train start --config fly_driver\configs\train_lab_vale.yaml
name: train_lab_vale  # scripts/lab_train.py replaces this with lab_<YYYYMMDD>_g<N> per run
output_dir: runs
# The best checkpoint on this PC, kept there by scripts/lab_train.py. Not in git. warm_start
# finds brain_best.pt beside it (policy_ -> brain_ in the file name).
init_from: weights/best/policy_best.pt
seeds: [0, 1, 2]  # at most 3 trainers per GPU (AGENTS.md, Lab PCs)
total_env_steps: 5000000
device: auto

eye:
  type: flyvis          # flyvis | pixels (GH-15 adds the CNN, random-projection and shuffled controls)
  frozen: true          # false fine-tunes the eye with the policy; needs a feed-forward eye
  params: {}            # e.g. readouts: [T4a, T4b, T4c, T4d, T5a, T5b, T5c, T5d], checkpoint: flow/0000/000

# 4096 neurons: scripts/brain_frame_time.py at the flyvis T4/T5 width (5768 inputs) puts the
# brain step at ~1.4 ms on a Mac CPU. Render, eye and policy already take ~14-16 ms of the
# 20 ms frame (docs/training.md), and 16384 neurons (~4.1 ms) would use all of what is left.
# output_dim 32 is the sweep's readout width, so the head stays small next to the brain.
brain:
  type: central_complex
  params:
    neuron_count: 4096
    output_dim: 32

policy:
  hidden_sizes: [64, 64]
  activation: tanh
  normalize_features: true
  init_log_std: 0.0
  # Throttle starts at +0.4 and brake at -0.6 (clipped to 0 most of the time), so the
  # untrained car pulls away. Zeros left it parked: every 20k-step episode stalled.
  init_action_mean: [0.0, 0.4, -0.6]

env:
  type: practice_track  # practice_track | dummy
  max_steps: 15000      # 5 minutes of simulated time at 50 Hz: room for a slow, clean lap
  params:
    racing_line: false  # off, as for the RQ1 comparisons
    scene:
      braking_line: false  # v7a: off; v7b paints it
    track_limit: 0.15
    random_start: true  # training episodes start anywhere round the lap; eval stays on the grid
    start_focus:  # GH-103: T3, T5 and T10 (Vale)
      share: 0.5
      zones: [[470.0, 620.0], [1290.0, 1700.0], [4800.0, 5200.0]]
    stall_speed_mps: 8.3  # under 30 km/h for over stall_seconds, from the first step, is a stall
    stall_seconds: 3.0    # flat out from rest passes 30 km/h in 0.7 s
    # fly_driver/envs/lap_time_reward.py. 105 s, not the 90 s default: the car's measured
    # limit is ~100 s (docs/training.md), so 90 s would be a bonus no lap can earn.
    reward:
      type: lap_time
      target_lap_time_s: 105.0
      pace_cap: 2.0  # a forward metre is weighted by speed / target speed, up to 2
      pace_floor: 0.0  # the slow rule now does the floor's job of making the car move
      crash_penalty_m: 18.0  # every early end; the largest that keeps faster better
      corner_bonus_m: 50.0  # v7: per corner per lap; braking for a corner beats crashing by 21
      scale: 0.01  # target-pace lap ~+89: unnormalised PPO needs small returns

ppo:
  rollout_steps: 2048
  minibatches: 32
  epochs: 10
  learning_rate: 5.0e-5  # half of v7a's 1e-4
  anneal_learning_rate: true
  # 0.99 is a 2 s horizon (1 / (1 - gamma) = 100 steps at 50 Hz). Braking from 300 to
  # 100 km/h takes ~1.3 s and 78 m, and the crash it avoids lands after the turn-in, 2-3 s
  # after the brake point: 0.99 weights a crash 150 steps away by 0.22. 0.997 is a 333-step
  # (6.7 s, ~400 m at target pace) horizon that weights it by 0.64, enough to see a braking
  # zone and the corner after it without stretching credit assignment over a whole lap.
  gamma: 0.997
  gae_lambda: 0.95
  clip_coef: 0.2
  clip_value_loss: true
  entropy_coef: 0.002  # GH-103: was 0.005; see the header
  value_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantages: true
  target_kl: 0.0075  # half of v7a's 0.015: stop the update's epochs past this approx_kl

eval:
  every_updates: 25     # deterministic evaluation every N updates; 0 disables it
  episodes: 1
  max_steps: null       # null = the env's own cap
  record_video: false

logging:
  wandb:
    enabled: false      # CSV is always written; this only adds a W&B mirror
    project: formula-fly
    entity: null
    mode: online
    tags: []
  # v6: every 10 updates (20k steps). Round 5's best 50-episode windows all ended before
  # its first checkpoint at update 50, so no seed's true best could be kept. ~2.6 MB each.
  checkpoint_every_updates: 10
