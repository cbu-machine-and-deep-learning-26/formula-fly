[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-driver"
version = "0.1.0"
description = "Connectome-constrained fruit-fly visual system driving a simulated race car."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Formula Fly contributors" }]
keywords = ["connectome", "flyvis", "reinforcement-learning", "carracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# Heavy / machine-specific extras. Not installed in default CI.
train = [
  "gymnasium[box2d]>=0.29",
  "torch>=2.2",
]
eye = [
  "flyvis",
]
logging = [
  "wandb",
]
video = [
  "imageio",
  "imageio-ffmpeg",
]

[project.urls]
Repository = "https://github.com/cbu-machine-and-deep-learning-26/formula-fly"

[tool.setuptools.packages.find]
include = ["fly_driver*"]

[tool.setuptools.package-data]
fly_driver = ["configs/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["fly_driver", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fly_driver"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "optional_flyvis: requires the flyvis extra",
  "optional_torch: requires torch",
  "optional_gym: requires gymnasium with Box2D",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
