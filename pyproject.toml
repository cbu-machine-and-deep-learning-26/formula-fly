[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-driver"
version = "0.1.0"
description = "A connectome-constrained fly visual system learning to drive a race car"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Kept deliberately small. numpy carries the geometry, mujoco carries the practice track.
# torch, flyvis, flybody and AssettoCorsaGym are heavy, platform-specific, or both, so each
# arrives with its own ticket and its own extra rather than being forced on anyone who only
# wants to run the tests (AGENTS.md §7 -- an x86-only wheel discovered in week 5 is the
# stated failure mode, so the default install stays installable on aarch64).
dependencies = [
    "numpy>=1.24",
    "mujoco>=3.2",
]

[project.optional-dependencies]
# pynput is only for scripts/drive.py: the MuJoCo viewer reports key presses but not
# releases, and held-key driving needs both edges. GLFW (a mujoco dependency) covers
# gamepads on its own.
dev = ["pytest>=8.0", "ruff>=0.6", "pynput>=1.7", "fly-driver[brains]"]

# Reading the FlyWire connectome (GH-23). pandas and pyarrow are pure wheels on every
# platform we target, aarch64 included, so unlike brian2 and torch they can be a
# declared extra rather than a separate virtualenv. The simulators themselves stay out:
# see `docs/running-the-stacks.md`. The connectome data is a 370 MB download and is not
# a dependency of anything -- point FLY_CONNECTOME_DIR at it.
brains = ["pandas>=2.0", "pyarrow>=14"]

# There is deliberately no `flyvis` extra here, and torch does not belong in this file.
# The optic lobe installs into its own virtualenv from `requirements-flyvis.txt` --
# flyvis 1.2.0 needs Python >=3.9,<3.13 and drags in platform-specific PyTorch/CUDA
# wheels, which is exactly the aarch64 trap AGENTS.md §7 says to keep out of the default
# install. See `docs/running-the-stacks.md` for the `.venv-flyvis` recipe. The practice
# track never imports the eye; it hands it a frame (see fly_driver/envs/practice_track.py).

[tool.setuptools.packages.find]
include = ["fly_driver*"]

# The vendored Silverstone centerline ships with the package; without this the CSV is missing
# from any non-editable install and the env fails at import time rather than at build time.
[tool.setuptools.package-data]
"fly_driver.envs" = ["data/*.csv", "data/*.md", "data/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "render: needs a working OpenGL context; skipped automatically when none is available",
    "slow: drives a car to racing speed; seconds per test rather than milliseconds",
]

[tool.ruff]
# AGENTS.md 14.2 says 88 and this says 100, and that disagreement is real: every module
# that arrived from develop is 88-clean, and this branch's are not. Settling it means
# rewrapping several thousand lines of prose that the formatter will not touch (it rewraps
# code, never comments or docstrings), which is its own change and not this feature's. The
# paths below therefore keep the settings they were written under until the team picks one
# value -- see the linked issue. Nothing here rewrites a module this branch does not own.
line-length = 100
target-version = "py310"
extend-exclude = [
    "fly_driver/eyes",
    "tests/eyes",
    "scripts/flyvis_eye_demo.py",
    "scripts/flyvis_smoke.py",
    "scripts/hex_resampler_plot.py",
]

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown; older ruff does not. Leaving it on
# makes AGENTS.md churn back and forth depending on whose machine ran it last.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
